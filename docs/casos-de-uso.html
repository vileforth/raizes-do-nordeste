<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Casos de uso — Raízes do Nordeste</title>
  <style>
    :root { --bg: #f4f1ea; --ink: #072f33; --muted: #5c6b6d; --card: #fffdf8; --line: #8aa0a2; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; font-family: "Segoe UI", sans-serif; color: var(--ink); background: var(--bg); }
    body { display: grid; grid-template-rows: 72px 1fr; height: 100vh; overflow: hidden; }
    header {
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
      padding: 0 18px; background: var(--ink); color: #fff;
    }
    header h1 { margin: 0; font-size: 18px; }
    header p { margin: 2px 0 0; font-size: 12px; color: #d5e4e5; }
    .tools { display: flex; gap: 8px; align-items: center; }
    button {
      border: 1px solid rgba(255,255,255,0.25); background: rgba(255,255,255,0.08);
      color: #fff; border-radius: 999px; height: 34px; padding: 0 12px; font: inherit; cursor: pointer;
    }
    button:hover { background: rgba(255,255,255,0.18); }
    #zoom-label { min-width: 52px; text-align: center; font-variant-numeric: tabular-nums; }
    #viewport { position: relative; overflow: hidden; background: radial-gradient(#e7e1d6 1px, transparent 1px); background-size: 22px 22px; cursor: grab; }
    #viewport.dragging { cursor: grabbing; }
    #world { position: absolute; top: 0; left: 0; transform-origin: 0 0; }
    svg.links { position: absolute; overflow: visible; pointer-events: none; }
    .actor, .uc, .boundary-label {
      position: absolute; background: var(--card); border: 1px solid #d8cfc0; box-shadow: 0 6px 16px rgba(7,47,51,0.08);
    }
    .actor {
      width: 150px; padding: 12px 10px; border-radius: 12px; text-align: center; cursor: pointer;
    }
    .actor strong { display: block; font-size: 13px; }
    .actor span { display: block; margin-top: 4px; font-size: 11px; color: var(--muted); }
    .uc {
      width: 210px; min-height: 56px; border-radius: 999px; padding: 10px 16px;
      display: flex; align-items: center; justify-content: center; text-align: center;
      font-size: 13px; cursor: pointer;
    }
    .uc.active, .actor.active { outline: 2px solid #ff4b00; }
    #system {
      position: absolute; left: 230px; top: 40px; width: 620px; height: 620px;
      border: 2px dashed #8aa0a2; border-radius: 16px;
    }
    .boundary-label {
      left: 250px; top: 18px; border: 0; box-shadow: none; background: var(--bg);
      font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; padding: 0 6px;
    }
    #detail {
      position: absolute; right: 16px; top: 16px; width: 300px; max-height: calc(100% - 32px);
      overflow: auto; background: #fff; border: 1px solid #e4ddd2; border-radius: 12px; padding: 14px;
    }
    #detail h2 { margin: 0 0 8px; font-size: 15px; }
    #detail p, #detail li { font-size: 13px; color: var(--muted); }
    #detail ul { padding-left: 18px; }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Casos de uso — Raízes do Nordeste</h1>
      <p>Roda do mouse: zoom. Arrastar o fundo: mover. Clique no ator ou no caso.</p>
    </div>
    <div class="tools">
      <button type="button" id="zoom-out">−</button>
      <span id="zoom-label">100%</span>
      <button type="button" id="zoom-in">+</button>
      <button type="button" id="fit">Ajustar</button>
    </div>
  </header>
  <div id="viewport">
    <div id="world">
      <div id="system"></div>
      <div class="boundary-label">Sistema web + API</div>
      <svg class="links" width="1200" height="760"></svg>
    </div>
    <aside id="detail">
      <h2>Como ler</h2>
      <p>Cinco atores à esquerda. Dez casos dentro do sistema. A linha liga quem inicia o fluxo. Detalhe em <code>02-descricoes-casos-de-uso.md</code>.</p>
    </aside>
  </div>
  <script>
    const actors = [
      { id: "cli", name: "Cliente", note: "Conta, pedido, pontos", x: 40, y: 70 },
      { id: "ate", name: "Atendente", note: "Balcão e protocolo", x: 40, y: 190 },
      { id: "coz", name: "Cozinheiro", note: "Status do pedido", x: 40, y: 310 },
      { id: "ger", name: "Gerente", note: "Uma unidade", x: 40, y: 430 },
      { id: "adm", name: "Administrador", note: "Rede inteira", x: 40, y: 550 },
    ];
    const cases = [
      { id: "UC01", title: "UC01 Acesso e cadastro", x: 280, y: 70, actors: ["cli", "adm"], text: "Register, login, refresh e cadastro de usuário com perfil." },
      { id: "UC02", title: "UC02 Pedidos", x: 530, y: 70, actors: ["cli", "ate", "coz", "ger", "adm"], text: "Cardápio, criação, código RECEBIDO e kanban. Sem personalização de item." },
      { id: "UC03", title: "UC03 Pagamento", x: 280, y: 170, actors: ["cli", "ate"], text: "POST /payments e confirmação interna. Sem adquirente." },
      { id: "UC04", title: "UC04 Acompanhar pedido", x: 530, y: 170, actors: ["cli", "coz", "ger"], text: "Status e hist_status_pedido. Transição inválida recusada." },
      { id: "UC05", title: "UC05 Promoções", x: 280, y: 270, actors: ["adm", "ger", "ate", "cli"], text: "CRUD, unidade, produto e validação de cupom." },
      { id: "UC06", title: "UC06 Fidelidade", x: 530, y: 270, actors: ["cli", "adm"], text: "Programa, saldo, movimento e resgate." },
      { id: "UC07", title: "UC07 Atendimento", x: 280, y: 370, actors: ["cli", "ate"], text: "Protocolo, kanban e histórico." },
      { id: "UC08", title: "UC08 Operação da unidade", x: 530, y: 370, actors: ["ger"], text: "Filtro pela unidade do funcionário." },
      { id: "UC09", title: "UC09 Gestão da rede", x: 280, y: 470, actors: ["adm"], text: "Unidades, usuários, perfis e promoções sem filtro de loja." },
      { id: "UC10", title: "UC10 Indicadores", x: 530, y: 470, actors: ["ger", "adm"], text: "Relatórios com escopo do papel." },
    ];

    const world = document.getElementById("world");
    const svg = world.querySelector("svg");
    const detail = document.getElementById("detail");
    let scale = 1, tx = 40, ty = 20, drag = null;

    function apply() {
      world.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;
      document.getElementById("zoom-label").textContent = Math.round(scale * 100) + "%";
    }

    function show(kind, item) {
      if (kind === "actor") {
        const ucs = cases.filter((c) => c.actors.includes(item.id)).map((c) => c.id).join(", ");
        detail.innerHTML = `<h2>${item.name}</h2><p>${item.note}</p><p>Participa de ${ucs}.</p>`;
      } else {
        detail.innerHTML = `<h2>${item.title}</h2><p>${item.text}</p><p>Atores: ${item.actors.join(", ")}.</p>`;
      }
    }

    actors.forEach((a) => {
      const el = document.createElement("div");
      el.className = "actor";
      el.style.left = a.x + "px";
      el.style.top = a.y + "px";
      el.innerHTML = `<strong>${a.name}</strong><span>${a.note}</span>`;
      el.onclick = () => { document.querySelectorAll(".active").forEach((n) => n.classList.remove("active")); el.classList.add("active"); show("actor", a); };
      world.appendChild(el);
    });

    cases.forEach((c) => {
      const el = document.createElement("div");
      el.className = "uc";
      el.id = c.id;
      el.style.left = c.x + "px";
      el.style.top = c.y + "px";
      el.textContent = c.title;
      el.onclick = () => { document.querySelectorAll(".active").forEach((n) => n.classList.remove("active")); el.classList.add("active"); show("uc", c); };
      world.appendChild(el);
    });

    function center(el) {
      return { x: el.offsetLeft + el.offsetWidth / 2, y: el.offsetTop + el.offsetHeight / 2 };
    }

    requestAnimationFrame(() => {
      cases.forEach((c) => {
        const ucEl = document.getElementById(c.id);
        const to = center(ucEl);
        c.actors.forEach((aid) => {
          const actorEl = [...document.querySelectorAll(".actor")].find((n) => n.querySelector("strong").textContent === actors.find((a) => a.id === aid).name);
          const from = center(actorEl);
          const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
          line.setAttribute("x1", from.x);
          line.setAttribute("y1", from.y);
          line.setAttribute("x2", to.x);
          line.setAttribute("y2", to.y);
          line.setAttribute("stroke", "#8aa0a2");
          line.setAttribute("stroke-width", "1.4");
          svg.appendChild(line);
        });
      });
    });

    const viewport = document.getElementById("viewport");
    viewport.addEventListener("wheel", (e) => {
      e.preventDefault();
      const next = Math.min(2.2, Math.max(0.4, scale + (e.deltaY < 0 ? 0.08 : -0.08)));
      scale = next;
      apply();
    }, { passive: false });
    viewport.addEventListener("pointerdown", (e) => {
      if (e.target.closest(".actor, .uc, #detail")) return;
      drag = { x: e.clientX - tx, y: e.clientY - ty };
      viewport.classList.add("dragging");
    });
    window.addEventListener("pointermove", (e) => {
      if (!drag) return;
      tx = e.clientX - drag.x;
      ty = e.clientY - drag.y;
      apply();
    });
    window.addEventListener("pointerup", () => { drag = null; viewport.classList.remove("dragging"); });
    document.getElementById("zoom-in").onclick = () => { scale = Math.min(2.2, scale + 0.1); apply(); };
    document.getElementById("zoom-out").onclick = () => { scale = Math.max(0.4, scale - 0.1); apply(); };
    document.getElementById("fit").onclick = () => { scale = 1; tx = 40; ty = 20; apply(); };
    apply();
  </script>
</body>
</html>
